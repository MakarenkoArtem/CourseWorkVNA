{% extends "base.html" %}

{% block content %}
<style>
    form {
      max-width: 480px;
      margin: 40px auto;
      font-family: system-ui, sans-serif;
    }
    .error {
      font-size: 0.85rem;
      color: #b00020;
    }
</style>
<h2 class="mb-4 text-center">Настройки ВАЦ</h2>

<form id="numsForm" class="needs-validation" novalidate>

    <div class="mb-3">
        <label for="a" class="form-label">Минимальная частота</label>
        <input id="a" name="a" type="number" class="form-control" min="0" step="1"
               required aria-describedby="errA">
        <div id="errA" class="error"></div>
    </div>

    <div class="mb-3">
        <label for="b" class="form-label">Максимальная частота</label>
        <input id="b" name="b" type="number" class="form-control" min="0" step="1"
               required aria-describedby="errB">
        <div id="errB" class="error"></div>
    </div>

    <div class="mb-3">
        <label for="c" class="form-label">Кол-во точек</label>
        <input id="c" name="c" type="number" class="form-control" min="0" step="1"
               required aria-describedby="errC">
        <div id="errC" class="error"></div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary w-100">Отправить</button>
        <button type="button" id="clearBtn" class="btn btn-outline-secondary w-100">Сброс</button>
    </div>
</form>

<div id="out" class="alert alert-info mt-3" hidden aria-live="polite"></div>

<script type="module" src="/static/js/settingsPage/main.js"></script>

{% endblock %}
